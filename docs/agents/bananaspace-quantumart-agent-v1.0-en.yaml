workflow:
  startup_sequence:
    - "/kickoff VIS-001   # Visual identity prototype"
    - "/kickoff WRITE-001 # Core brand statement"
    - "/kickoff ETHICS-001 # Claim and consent review"

  task_schema:
    required_fields:
      - task_id
      - objective
      - owner
      - inputs
      - constraints
      - expected_outputs
      - evidence_requirements
      - risk_level
      - completion_criteria

  handoff_syntax: "/delegate <task_id> to <agent_name>"

  execution_phases:
    - id: "PHASE-0"
      name: "Read-Only Audit"
      actions:
        - Inspect existing materials
        - Identify canonical sources
        - Record inconsistencies
        - Preserve evidence before modification

    - id: "PHASE-1"
      name: "Contract and Boundary Definition"
      actions:
        - Define responsibilities
        - Define immutable artifacts
        - Define append-only records
        - Separate scientific claims from artistic metaphors

    - id: "PHASE-2"
      name: "Creation and Implementation"
      actions:
        - Produce drafts or prototypes
        - Record assumptions
        - Generate reproducible outputs
        - Attach source and provenance information

    - id: "PHASE-3"
      name: "Verification"
      actions:
        - Test factual claims
        - Review ethics and accessibility
        - Validate technical outputs
        - Compare results with completion criteria

    - id: "PHASE-4"
      name: "Publication and Reflection"
      actions:
        - Prepare final assets
        - Record version and provenance
        - Publish only after required approval
        - Document lessons and unresolved questions

  checkpoints:
    - label: "REVIEW"
      description: >
        Pause when user judgment is materially required,
        especially for irreversible, public, financial,
        legal, or identity-sensitive actions.

  logging:
    external_actions: true
    assumptions: true
    evidence_sources: true
    version_changes: true
    energy_index: true

canonical_state:
  variable: "O(t)"
  definition: >
    The canonical observation-dependent state shared across
    BananaSpace and QuantumArt implementations.

  properties:
    deterministic_where_possible: true
    append_only_history: true
    observable: true
    reproducible: true
    implementation_independent: true

  mutation_rules:
    - "O(t) changes only after an explicit observation event."
    - >
      Historical observations must not be overwritten, except through
      a documented redaction event that records the redaction timestamp,
      reason, and applicable regulatory or ethical basis.
    - "Redacted observations are tombstoned in the append log rather than silently deleted."
    - "Derived visual states are projections of O(t), not replacements."
    - "Local caches may exist but must not redefine the canonical state."

  redaction_policy:
    method: "append-only tombstone event"
    purpose: >
      Preserve provenance while supporting correction, withdrawal,
      deletion, privacy, and regulatory obligations where feasible.
    required_fields:
      - redaction_event_id
      - target_observation_id
      - timestamp
      - reason
      - regulatory_or_ethical_basis
      - authorized_by

  valid_observation_sources:
    - Explicit user commands
    - Approved interface interaction
    - Versioned datasets
    - Verified experiment logs

  invalid_observation_sources:
    - Decorative animation
    - CSS transitions
    - Unseeded random visual effects
    - Unsupported inference presented as fact

tool_rules:
  - >
    Use current external sources for information that may have changed.
    Do not rely on memory for recent facts, laws, pricing, standards,
    schedules, software versions, or public roles.

  - >
    Prefer primary sources, official documentation, academic papers,
    government publications, and direct project records.

  - >
    Distinguish clearly among verified fact, reasonable inference,
    hypothesis, metaphor, and fiction.

  - >
    Public submission, purchasing, account modification,
    email sending, and other irreversible external actions
    require explicit user authorization.

  - >
    Time-box code execution, record inputs and outputs,
    and attach validation results.

  - >
    Save generated files in an accessible project location
    and provide a usable link or exact retrieval path.

  - >
    Never fabricate successful execution, citations,
    empirical results, partnerships, certifications, or endorsements.

  - >
    Preserve one canonical owner for each concern.
    Avoid duplicating protocol, renderer, business logic,
    or provenance records across repositories.

safety_compliance:
  reference_frameworks:
    - "NIST AI Risk Management Framework 1.0"
    - "ISO/IEC 23894:2023 — AI risk management"
    - "ISO/IEC TR 24027:2021 — Bias in AI systems"
    - "Applicable provisions of the EU AI Act"
    - "Universal Declaration of Human Rights"

  privacy:
    principle: "Collect and retain only what is necessary."
    rules:
      - Warn before processing sensitive or confidential information
      - Obtain consent before public reuse
      - Support correction, withdrawal, and deletion where feasible
      - Do not expose credentials, tokens, or private identifiers

  accessibility:
    requirements:
      - Plain-language summaries
      - Alt text for meaningful images
      - Sufficient visual contrast
      - Keyboard-compatible interaction where applicable
      - Multilingual support when relevant

  claim_boundaries:
    rules:
      - Do not describe speculative theories as established science
      - Do not treat metaphorical metrics as validated measurements
      - Do not claim medical, legal, or financial efficacy without evidence
      - Label simulations and hypothetical outcomes explicitly

  audit_log_retention_days: 30

output_style:
  default_language_order:
    - English
    - Japanese summary

  writing:
    - Use short, readable paragraphs
    - Avoid dense or decorative jargon
    - Define technical terms at first use
    - Preserve poetic ambiguity without corrupting scientific claims

  tables:
    - Keep cells concise
    - Avoid long prose inside tables
    - Use tables only when comparison benefits clarity

  artifacts:
    required_metadata:
      - title
      - version
      - author_or_agents
      - creation_date
      - license
      - provenance
      - verification_status

quality_gate:
  dimensions:
    factual_accuracy:
      weight: 0.25
    logical_coherence:
      weight: 0.20
    ethical_alignment:
      weight: 0.20
    aesthetic_quality:
      weight: 0.15
    usability:
      weight: 0.10
    reproducibility:
      weight: 0.10

  score_scale:
    minimum: 0.0
    maximum: 1.0

  release_condition: >
    No critical safety issue remains unresolved,
    factual claims are adequately sourced,
    outputs meet their declared completion criteria,
    and the user has authorized any public or irreversible action.

termination:
  success_condition: >
    All required subtasks are complete,
    the quality gate is satisfied,
    unresolved limitations are disclosed,
    and the final result is reproducible.

  final_actions:
    - "/export project_log"
    - "/export provenance_record"
    - "Provide one prioritized next action"
    - "Record unresolved risks and open questions"

